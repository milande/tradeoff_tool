ccent);border-radius:8px;pointer-events:none}.fine-tune-reason{flex:2;padding:4px 6px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.08);color:#aac;font-size:0.8rem;font-style:italic;outline:none;font-family:inherit;min-width:60px}.fine-tune-reason::placeholder{color:rgba(255,255,255,.18)}.fine-tune-reason:focus{border-bottom-color:rgba(255,255,255,.3);color:#ddf}.fine-tune-actions{margin-top:16px;display:flex;align-items:center;gap:12px}.optional-label{font-size:0.73rem;color:rgba(255,255,255,.28);font-weight:400;margin-left:6px}.custom-badge{font-size:0.72rem;background:rgba(24,200,255,.12);color:var(--accent);border:1px solid rgba(24,200,255,.25);border-radius:20px;padding:2px 8px;margin-left:8px;display:none}.custom-badge.visible{display:inline}.scenario-save-row{display:flex;gap:.5rem;margin:1rem 0 .5rem}.scenario-save-row input{flex:1;min-width:0}.sc-wrap{overflow-x:auto;margin-top:.5rem}.sc-table{width:100%;border-collapse:collapse;font-size:.87rem;white-space:nowrap}.sc-table thead th{padding:.4rem .8rem;text-align:right;color:rgba(255,255,255,.38);font-weight:500;font-size:.78rem;border-bottom:1px solid rgba(255,255,255,.08)}.sc-table thead th:first-child{text-align:left;color:transparent;min-width:8rem;width:8rem}.sc-del,.sc-load-btn{background:none;border:none;cursor:pointer;padding:0 0 0 .35rem;font-size:.72rem;vertical-align:middle;transition:color .15s;line-height:1}.sc-del{color:rgba(255,255,255,.22)}.sc-del:hover{color:rgba(255,255,255,.7)}.sc-load-btn{color:rgba(255,255,255,.3)}.sc-load-btn:hover{color:rgba(255,255,255,.85)}.sc-w-row td,.sc-s-row td{padding:.28rem .8rem;border-bottom:1px solid rgba(255,255,255,.04)}.sc-label{color:rgba(255,255,255,.5);font-size:.82rem;text-align:left}.sc-sol-name{font-weight:500}.sc-w{text-align:right;color:rgba(255,255,255,.42);font-variant-numeric:tabular-nums}.sc-sep td{padding:0;height:1px;background:rgba(255,255,255,.1)}.sc-cell{text-align:right;font-variant-numeric:tabular-nums;padding:.3rem .8rem;border-left:2px solid transparent}.sc-rank{font-weight:700}.sc-score{font-size:.77rem;color:rgba(255,255,255,.38);margin-left:.25rem}.sc-winner .sc-score{color:rgba(255,255,255,.6)}.sc-ko-cell{color:rgba(255,255,255,.18);text-align:right;padding:.3rem .8rem}.sc-ko .sc-label{opacity:.35}.sc-ko .sc-sol-name{text-decoration:line-through}.sc-cr-row td{padding:.12rem .8rem;border-bottom:none}.sc-cr-label{color:rgba(255,255,255,.3);font-size:.78rem;padding-left:1.2rem !important;white-space:nowrap}.sc-cr-badge{display:inline-block;background:rgba(255,255,255,.07);border-radius:3px;padding:0 .3rem;margin-left:.35rem;font-size:.72rem;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums}.sc-badge-hi{background:rgba(251,191,36,.18);color:#fbbf24}.sc-contrib{font-size:.77rem;color:rgba(255,255,255,.3);margin-left:.3rem;font-variant-numeric:tabular-nums}.sc-w-hi{color:#fbbf24;font-weight:600}.sc-cell-hi{background:rgba(251,191,36,.07)}.sc-cr-cell{text-align:right;color:rgba(255,255,255,.28);font-size:.78rem;font-variant-numeric:tabular-nums;padding:.12rem .8rem}.sc-s-row td{border-top:1px solid rgba(255,255,255,.07)}@media(max-width:600px){.pair-btn{font-size:0.75rem;padding:8px 4px}.rating-btn{width:30px;height:30px;font-size:0.8rem}.criterion-name{font-size:0.8rem}.be-label{width:80px}}</style>

<body>
<div class="container">
<div class="toolbar">
<div class="app-brand">
<span class="app-name">DecisionLab</span>
<span class="app-version">v0.5</span>
</div>
<div class="toolbar-actions">
<button id="langToggle" class="btn-toolbar lang-toggle">DE</button>
<button id="undoBtn" class="btn-toolbar" data-i18n-title="undoTitle" disabled>↶</button>
<button id="redoBtn" class="btn-toolbar" data-i18n-title="redoTitle" disabled>↷</button>
<button id="helpBtn" class="btn-toolbar" data-i18n="help"></button>
<button id="printBtn" class="btn-toolbar" data-i18n="print"></button>
<button id="newBtn" class="btn-toolbar" data-i18n="newSession"></button>
<button id="exportHtmlBtn" class="btn-toolbar" data-i18n="exportHtml"></button>
<button id="exportCsvBtn" class="btn-toolbar" data-i18n="exportCsv"></button>
<button id="exportBtn" class="btn-toolbar" data-i18n="save"></button>
<label class="btn-toolbar"><span data-i18n="load"></span><input type="file" id="importInput" accept=".json"></label>
</div>
</div>
<div id="helpOverlay" class="help-overlay hidden">
<div class="help-modal">
<button id="helpClose" class="help-close">✕</button>
<h2 class="help-title" data-i18n="helpTitle"></h2>
<p class="help-intro" data-i18n-html="helpIntro"></p>
<div class="help-section help-criteria">
<h3 data-i18n="helpCriteriaTitle"></h3>
<p data-i18n-html="helpCriteriaText"></p>
</div>
<div class="help-section help-solutions">
<h3 data-i18n="helpSolutionsTitle"></h3>
<p data-i18n-html="helpSolutionsText"></p>
</div>
<div class="help-section help-data">
<h3 data-i18n="helpDataTitle"></h3>
<p data-i18n-html="helpDataText"></p>
</div>
<div class="help-section help-pro">
<h3 data-i18n="helpProTitle"></h3>
<p data-i18n-html="helpProText"></p>
</div>
</div>
</div>
<div class="project-header">
<input id="decisionNameInput" class="project-input project-input-name" type="text" data-i18n-placeholder="decisionNamePlaceholder" placeholder="">
<input id="bearbeiterInput" class="project-input project-input-author" type="text" data-i18n-placeholder="bearbeiterPlaceholder" placeholder="">
</div>
<div class="tabs">
<button class="tab-btn active" data-tab="criteria" data-i18n="tabCriteria"></button>
<button class="tab-btn" data-tab="solutions" data-i18n="tabSolutions"></button>
<button class="tab-btn" data-tab="sensitivity" id="sensitivityTab" data-i18n="tabSensitivity"></button>
<button id="proToggle" class="pro-toggle">⚡ Pro</button>
</div>
<div id="tab-criteria" class="tab-content active">
<div class="section" id="criteriaInputSection">
<div class="section-content">
<h2 data-i18n="step1"></h2>
<div id="criteriaList"></div>
<button id="addBtn" class="btn-add" data-i18n="addCriterion"></button>
</div>
</div>
<div class="section" id="compareSection">
<div class="section-content">
<h2 data-i18n="step2"></h2>
<div id="pairsContainer"></div>
<div id="consistencyHint"></div>
</div>
</div>
<div class="section" id="resultsSection">
<div class="section-content">
<h2 data-i18n="criteriaWeights"></h2>
<table>
<thead><tr><th data-i18n="thCriterion"></th><th data-i18n="thPoints"></th><th data-i18n="thWeight"></th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
<div class="section" id="fineTuneSection">
<div class="section-content">
<h2><span data-i18n="fineTuneWeights"></span><span class="optional-label" data-i18n="optional"></span><span id="customBadge" class="custom-badge" data-i18n="custom"></span></h2>
<div id="fineTuneList"></div>
<div class="fine-tune-actions">
<button id="resetFineBtn" class="btn-secondary" data-i18n="resetToPairwise"></button>
</div>
</div>

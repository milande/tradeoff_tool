<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DecisionLab</title>

,215,0,.15)}.tab-btn{padding:10px 28px;border:none;border-radius:10px;cursor:pointer;font-size:1rem;font-weight:600;transition:background .15s,color .15s,opacity .15s}.tab-btn[data-tab="criteria"]{background:rgba(24,200,255,.1);color:rgba(24,200,255,.7)}.tab-btn[data-tab="solutions"]{background:rgba(244,114,182,.1);color:rgba(244,114,182,.7)}.tab-btn[data-tab="sensitivity"]{background:rgba(74,222,128,.1);color:rgba(74,222,128,.7)}.tab-btn:not(.disabled):hover{filter:brightness(1.25)}.tab-btn[data-tab="criteria"].active{background:#18c8ff;color:#00131b}.tab-btn[data-tab="solutions"].active{background:#f472b6;color:#1a0020}.tab-btn[data-tab="sensitivity"].active{background:#4ade80;color:#002010}.tab-btn.disabled{opacity:.25;cursor:not-allowed}.tab-content{display:none}.tab-content.active{display:block}.section{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);padding:30px;border-radius:18px;box-shadow:0 0 40px var(--glow);margin-bottom:24px}.section h1{margin-top:0;margin-bottom:30px}.section h2{margin:0 0 20px 0;font-size:1.1rem;opacity:.9}.section-content{padding:10px}.hidden{display:none}.hint{opacity:.5;font-size:0.85rem;margin:0 0 16px}input[type=text]{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:none;background:#1a2332;color:white;box-sizing:border-box}.criteria-item{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.criteria-item input{margin:0;flex:1;min-width:0}.sol-note{width:100%;font-size:0.78rem;color:rgba(255,255,255,.45);background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.08);padding:3px 2px;font-family:inherit;outline:none;transition:border-color .15s}.sol-note:focus{border-bottom-color:rgba(255,255,255,.3);color:rgba(255,255,255,.7)}.sol-note::placeholder{color:rgba(255,255,255,.18)}.rank-note{font-size:0.72rem;font-weight:400;color:rgba(255,255,255,.35);margin-top:2px;font-style:italic}.btn-remove{padding:10px 12px;background:#ff4444;color:white;border:none;border-radius:8px;cursor:pointer;font -btn{width:36px;height:36px;border:none;border-radius:8px;background:#1a2332;color:#9dd;cursor:pointer;font-size:0.9rem;font-weight:600;transition:background .15s}.rating-btn:hover{background:#263041}.rating-btn.active{background:var(--accent);color:var(--accent-text)}.ri-sol-header{font-weight:700;font-size:0.9rem;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}.ri-sol-header:first-child{margin-top:0}.rs-ticks{position:absolute;top:34px;left:0;width:100%}.rs-tick{position:absolute;transform:translateX(-50%);font-size:0.65rem;color:rgba(255,255,255,.4)}#ratingImpactContainer .be-track-wrap{cursor:ew-resize}.be-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}.be-legend-item{display:flex;align-items:center;gap:7px;font-size:0.85rem;opacity:.85}.be-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.be-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:28px}#sensImpact .be-row{margin-bottom:10px}.be-label{width:130px;font-size:0.9rem;flex-shrink:0;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.be-track-wrap{flex:1;position:relative;cursor:ew-resize;user-select:none}.be-track{height:28px;display:flex;border-radius:6px;overflow:hidden}.be-segment{height:100%;opacity:.82}.be-current{position:absolute;top:0;height:28px;width:3px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.55);pointer-events:none}.be-current::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7)}.be-bp-row{position:relative;height:20px;margin-top:4px}.be-bp-label{position:absolute;transform:translateX(-50%);font-size:0.72rem;opacity:.55;white-space:nowrap}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:10px;border-bottom:1px solid #2a3344;text-align:left}th{font-weight:bold;opacity:.8}#compareSection,#resultsSection,#fineTuneSection{display:none}#compareSection.active,#resultsSection.active,#fineTuneSection.active{display:block}.fine-tune-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}.fine-tune-row:last-child{border-bottom:none}.fine-tune-name{flex:1;font-size:0.9rem;color:#cce}.fine-tune-input{width:68px;padding:5px 8px;background:#1a2332;border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-size:0.9rem;text-align:right;appearance:textfield;-moz-appearance:textfield}.fine-tune-input::-webkit-inner-spin-button,.fine-tune-input::-webkit-outer-spin-button{display:none}.fine-tune-input:focus{outline:none;border-color:var(--accent)}.fine-tune-pct{font-size:0.8rem;color:rgba(255,255,255,.3);width:10px}.fine-tune-bar{flex:1;height:5px;background:#1a2332;border-radius:3px;overflow:hidden;min-width:40px}.fine-tune-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .25s}.fine-tune-reason{flex:2;padding:4px 6px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.08);color:#aac;font-size:0.8rem;font-style:italic;outline:none;font-family:inherit;min-width:60px}.fine-tune-reason::placeholder{color:rgba(255,255,255,.18)}.fine-tune-reason:focus{border-bottom-color:rgba(255,255,255,.3);color:#ddf}.fine-tune-actions{margin-top:16px;display:flex;align-items:center;gap:12px}.optional-label{font-size:0.73rem;color:rgba(255,255,255,.28);font-weight:400;margin-left:6px}.custom-badge{font-size:0.72rem;background:rgba(24,200,255,.12);color:var(--accent);border:1px solid rgba(24,200,255,.25);border-radius:20px;padding:2px 8px;margin-left:8px;display:none}.custom-badge.visible{display:inline}.scenario-save-row{display:flex;gap:.5rem;margin:1rem 0 .5rem}.scenario-save-row input{flex:1;min-width:0}.sc-wrap{overflow-x:auto;margin-top:.5rem}.sc-table{width:100%;border-collapse:collapse;font-size:.87rem;white-space:nowrap}.sc-table thead th{padding:.4rem .8rem;text-align:right;color:rgba(255,255,255,.38);font-weight:500;font-size:.78rem;border-bottom:1px solid rgba(255,255,255,.08)}.sc-table thead th:first-child{text-align:left;color:transparent;min-width:8rem;width:8rem}.sc-del,.sc-load-btn{background:none;border:none;cursor:pointer;padding:0 0 0 .35rem;font-size:.72rem;vertical-align:middle;transition:color .15s;line-height:1}.sc-del{color:rgba(255,255,255,.22)}.sc-del:hover{color:rgba(255,255,255,.7)}.sc-load-btn{color:rgba(255,255,255,.3)}.sc-load-btn:hover{color:rgba(255,255,255,.85)}.sc-w-row td,.sc-s-row td{padding:.28rem .8rem;border-bottom:1px solid rgba(255,255,255,.04)}.sc-label{color:rgba(255,255,255,.5);font-size:.82rem;text-align:left}.sc-sol-name{font-weight:500}.sc-w{text-align:right;color:rgba(255,255,255,.42);font-variant-numeric:tabular-nums}.sc-sep td{padding:0;height:1px;background:rgba(255,255,255,.1)}.sc-cell{text-align:right;font-variant-numeric:tabular-nums;padding:.3rem .8rem;border-left:2px solid transparent}.sc-rank{font-weight:700}.sc-score{font-size:.77rem;color:rgba(255,255,255,.38);margin-left:.25rem}.sc-winner .sc-score{color:rgba(255,255,255,.6)}.sc-ko-cell{color:rgba(255,255,255,.18);text-align:right;padding:.3rem .8rem}.sc-ko .sc-label{opacity:.35}.sc-ko .sc-sol-name{text-decoration:line-through}.sc-cr-row td{padding:.12rem .8rem;border-bottom:none}.sc-cr-label{color:rgba(255,255,255,.3);font-size:.78rem;padding-left:1.2rem !important;white-space:nowrap}.sc-cr-badge{display:inline-block;background:rgba(255,255,255,.07);border-radius:3px;padding:0 .3rem;margin-left:.35rem;font-size:.72rem;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums}.sc-badge-hi{background:rgba(251,191,36,.18);color:#fbbf24}.sc-contrib{font-size:.77rem;color:rgba(255,255,255,.3);margin-left:.3rem;font-variant-numeric:tabular-nums}.sc-w-hi{color:#fbbf24;font-weight:600}.sc-cell-hi{background:rgba(251,191,36,.07)}.sc-cr-cell{text-align:right;color:rgba(255,255,255,.28);font-size:.78rem;font-variant-numeric:tabular-nums;padding:.12rem .8rem}.sc-s-row td{border-top:1px solid rgba(255,255,255,.07)}@media(max-width:600px){.pair-btn{font-size:0.75rem;padding:8px 4px}.rating-btn{width:30px;height:30px;font-size:0.8rem}.criterion-name{font-size:0.8rem}.be-label{width:80px}}</style>

<body>
<div class="container">
<div class="toolbar">
<div class="app-brand">
<span class="app-name">DecisionLab</span>
<span class="app-version">v0.4</span>
</div>
<div class="toolbar-actions">
<button id="langToggle" class="btn-toolbar lang-toggle">DE</button>
<button id="helpBtn" class="btn-toolbar" data-i18n="help"></button>
<button id="printBtn" class="btn-toolbar" data-i18n="print"></button>
<button id="newBtn" class="btn-toolbar" data-i18n="newSession"></button>
<button id="exportHtmlBtn" class="btn-toolbar" data-i18n="exportHtml"></button>
<button id="exportBtn" class="btn-toolbar" data-i18n="save"></button>
<label class="btn-toolbar"><span data-i18n="load"></span><input type="file" id="importInput" accept=".json"></label>
</div>
</div>
<div id="helpOverlay" class="help-overlay hidden">
<div class="help-modal">
<button id="helpClose" class="help-close">✕</button>
<h2 class="help-title" data-i18n="helpTitle"></h2>
<p class="help-intro" data-i18n-html="helpIntro"></p>
<div class="help-section help-criteria">
<h3 data-i18n="helpCriteriaTitle"></h3>
<p data-i18n-html="helpCriteriaText"></p>
</div>
<div class="help-section help-solutions">
<h3 data-i18n="helpSolutionsTitle"></h3>
<p data-i18n-html="helpSolutionsText"></p>
</div>
<div class="help-section help-data">
<h3 data-i18n="helpDataTitle"></h3>
<p data-i18n-html="helpDataText"></p>
</div>
<div class="help-section help-pro">
<h3 data-i18n="helpProTitle"></h3>
<p data-i18n-html="helpProText"></p>
</div>
</div>
</div>
<div class="project-header">
<input id="decisionNameInput" class="project-input project-input-name" type="text" data-i18n-placeholder="decisionNamePlaceholder" placeholder="">
<input id="bearbeiterInput" class="project-input project-input-author" type="text" data-i18n-placeholder="bearbeiterPlaceholder" placeholder="">
</div>
<div class="tabs">
<button class="tab-btn active" data-tab="criteria" data-i18n="tabCriteria"></button>
<button class="tab-btn" data-tab="solutions" data-i18n="tabSolutions"></button>
<button class="tab-btn" data-tab="sensitivity" id="sensitivityTab" data-i18n="tabSensitivity"></button>
<button id="proToggle" class="pro-toggle">⚡ Pro</button>
</div>
<div id="tab-criteria" class="tab-content active">
<div class="section" id="criteriaInputSection">
<div class="section-content">
<h2 data-i18n="step1"></h2>
<div id="criteriaList"></div>
<button id="addBtn" class="btn-add" data-i18n="addCriterion"></button>
</div>
</div>
<div class="section" id="compareSection">
<div class="section-content">
<h2 data-i18n="step2"></h2>
<div id="pairsContainer"></div>
</div>
</div>
<div class="section" id="resultsSection">
<div class="section-content">
<h2 data-i18n="criteriaWeights"></h2>
<table>
<thead><tr><th data-i18n="thCriterion"></th><th data-i18n="thPoints"></th><th data-i18n="thWeight"></th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
<div class="section" id="fineTuneSection">
<div class="section-content">
<h2><span data-i18n="fineTuneWeights"></span><span class="optional-label" data-i18n="optional"></span><span id="customBadge" class="custom-badge" data-i18n="custom"></span></h2>
<div id="fineTuneList"></div>
<div class="fine-tune-actions">
<button id="resetFineBtn" class="btn-secondary" data-i18n="resetToPairwise"></button>
</div>
</div>
</div>
</div>
<div id="tab-solutions" class="tab-content">
<div class="section">
<div class="section-content">
<h2 data-i18n="step3"></h2>
<div id="solutionList"></div>
<button id="addSolutionBtn" class="btn-add" data-i18n="addSolution"></button>
</div>
</div>
<div class="section">
<div class="section-content">
<h2 data-i18n="rateSolutions"></h2>
<div id="solutionMatrix"></div>
</div>
</div>
<div class="section">
<div class="section-content">
<h2 data-i18n="ranking"></h2>
<table>
<thead><tr><th data-i18n="thSolution"></th><th data-i18n="thScore"></th><th data-i18n="thRating"></th></tr></thead>
<tbody id="solutionRankingBody"></tbody>
</table>
</div>
</div>
</div>
<div id="tab-sensitivity" class="tab-content">
<div class="section">
<div class="section-content">
<h2 data-i18n="criterionImpact"></h2>
<p class="hint" data-i18n="sensitivityHint"></p>
<button id="resetWeightsBtn" class="btn-secondary" data-i18n="resetToPairwiseWeights"></button>
<div id="sensImpact"></div>
</div>
</div>
<div class="section">
<div class="section-content">
<h2 data-i18n="ranking"></h2>
<table>
<thead><tr><th data-i18n="thSolution"></th><th data-i18n="thScore"></th><th data-i18n="thRating"></th></tr></thead>
<tbody id="sensRankingBody"></tbody>
</table>

function loadScenario(id) {
const isBase = id === '__base__';
const scenario = isBase ? null : scenarios.find(s => s.id === id);
const weights = isBase ? computeWeights() : (scenario || {}).weights;
if (!weights) return;
criteria.forEach(c => { if (weights[c] !== undefined) sensWeights[c] = weights[c]; });
const total = Object.values(sensWeights).reduce((s, v) => s + v, 0);
if (total > 0) criteria.forEach(c => sensWeights[c] /= total);
if (isBase) explorationRatings = { ...ratings };
else if (scenario && scenario.ratings) explorationRatings = { ...scenario.ratings };
updateSensImpact();
updateSensRanking();
updateRatingImpact();
}

document.querySelector('.tab-btn[data-tab="criteria"]').classList.add('active');
document.getElementById('tab-criteria').classList.add('active');
}
if (comparisonStarted) renderSolutionMatrix();
}
document.getElementById('decisionNameInput').oninput = e => { decisionName = e.target.value; saveState(); };
document.getElementById('bearbeiterInput').oninput = e => { bearbeiter = e.target.value; saveState(); };
proToggle.onclick = () => {
proMode = !proMode;
applyProMode();
saveState();
};
document.querySelectorAll('.tab-btn').forEach(btn => {
btn.onclick = () => {
if (btn.classList.contains('disabled')) return;
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
btn.classList.add('active');
document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
if (btn.dataset.tab === 'solutions') renderSolutionMatrix();
if (btn.dataset.tab === 'sensitivity') { updateSensRanking(); updateSensImpact(); updateRatingImpact(); }
};
});
updateTabState();
// Auto-load saved session
try {
const saved = localStorage.getItem(STORAGE_KEY);
if (saved) applyState(JSON.parse(saved));
else {
decisionName = ''; bearbeiter = '';
document.getElementById('decisionNameInput').value = '';
document.getElementById('bearbeiterInput').value = '';
applyProMode();
applyLang();
}
} catch (e) { applyProMode(); applyLang(); }
// END Auto-load</script>
</body>
</html>
